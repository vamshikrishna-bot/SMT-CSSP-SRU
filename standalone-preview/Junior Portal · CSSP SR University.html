<script>
const $=i=>document.getElementById(i),esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),pill=(t,c)=>`<span class="pill ${c}">${t}</span>`;
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2800)}
let D={};try{D=JSON.parse(localStorage.getItem('jr-v1')||'{}')}catch(e){}
D.links=D.links||{};D.asm=D.asm||{};D.sub=D.sub||{};D.att=D.att||{};

const G=[['Demo Senior 1','Demo Group 1',`DEMO0001 Demo Student 1\nDEMO0002 Demo Student 2`],['Demo Senior 2','Demo Group 2',`DEMO0003 Demo Student 3\nDEMO0004 Demo Student 4`],['Demo Senior 3','Demo Group 3',`DEMO0005 Demo Student 5\nDEMO0006 Demo Student 6`],['Demo Senior 4','Demo Group 4',`DEMO0007 Demo Student 7\nDEMO0008 Demo Student 8`],['Demo Senior 5','Demo Group 5',`DEMO0009 Demo Student 9\nDEMO0010 Demo Student 10`],['Demo Senior 6','Demo Group 6',`DEMO0011 Demo Student 11\nDEMO0012 Demo Student 12`]];
const JUN=G.flatMap(([m,b,t])=>t.split('\n').map(l=>{const i=l.indexOf(' ');return{roll:l.slice(0,i),name:l.slice(i+1).trim(),sr:m,batch:b}}));
const T=[98,111,141,156,170,184,207,207,207,207,207,207],W0=new Date('2026-10-05T00:00:00'),cw=()=>Math.min(11,Math.max(0,Math.floor((Date.now()-W0)/6048e5)));
const LK=[['lc','LeetCode'],['cf','Codeforces'],['hr','HackerRank'],['li','LinkedIn'],['gh','GitHub'],['cv','Résumé']];
const MOCK={0:{sc:7,t:4,c:3,p:4,rec:'Good progress. Revise DP.'}};
const OLD=[{id:'demo1',title:'DEMO · Proctored Test: Arrays & Strings',desc:'3 questions, 10 minutes. Camera + mic on, stay full-screen, no tab switching or pasting. 1st violation = warning, 2nd = auto logout, no reattempt.',due:'2026-10-14',max:30,link:'',mins:10,qs:['Explain how you would find two numbers in an array that add up to a target (Two Sum). What is the time complexity?','Write a function to check whether a string is a palindrome, and explain how it works.','What is the difference between an array and a linked list? Give one use case for each.']},
{id:'demo2',title:'DEMO · Weekly LeetCode Contest',desc:'Solve the contest problems and report your score to your senior.',due:'2026-10-18',max:100,link:'https://leetcode.com/contest/',mins:0,qs:[]}];

const AS=[
{id:'ca1',ty:'mcq',title:'Week 1 Quiz: Data Structures (MCQ)',desc:'Choose the correct option. Auto-graded.',due:'2026-10-12',max:3,qs:[{q:'Which data structure uses LIFO order?',o:['Queue','Stack','Array','Heap'],k:1},{q:'Time complexity of binary search?',o:['O(n)','O(n log n)','O(log n)','O(1)'],k:2},{q:'Which structure is used for BFS?',o:['Stack','Queue','Tree','Set'],k:1}]},
{id:'ca2',ty:'link',title:'LeetCode Problem: Two Sum',desc:'Solve it on LeetCode, then paste the link to your accepted submission.',due:'2026-10-14',max:20,prob:'https://leetcode.com/problems/two-sum/',qs:[]},
{id:'ca3',ty:'text',title:'Written: Explain Big-O',desc:'Write a short explanation with two examples.',due:'2026-10-15',max:20,qs:['Explain Big-O notation with two examples.']},
{id:'ca4',ty:'file',title:'Project Report (upload)',desc:'Upload your report as PDF, Word or TXT (max 700 KB).',due:'2026-10-18',max:30,qs:[]},
{id:'ca5',ty:'done',title:'Weekly LeetCode Contest (practice)',desc:'Take the contest on LeetCode, then mark it as done.',due:'2026-10-18',max:0,prob:'https://leetcode.com/contest/',qs:[]}];
const S={u:null,o:null,role:'jr',n:null,p:'',ex:null},sub=(r,w)=>D.sub[r+'|'+w],fd=d=>new Date(d).toLocaleDateString(undefined,{day:'numeric',month:'short'});
const lastN=r=>{for(let w=cw();w>=0;w--){const s=sub(r,w);if(s)return s.n}return 0};
const curN=()=>{const s=sub(S.u.roll,cw());return S.n==null?(s?s.n:lastN(S.u.roll)):S.n};
function render(){const a=$('app');if(S.o)a.innerHTML=otherV();else if(!S.u)a.innerHTML=loginV();else if(S.ex)a.innerHTML=examV();else a.innerHTML=homeV()}
function loginV(){const r=S.role,opts=r==='jr'?JUN.map(j=>[j.roll,j.name+' · '+j.roll+' ('+j.sr+')']):SENIORS.map(n=>[n,n]);
return `<div class="login"><div class="lp"><div style="font-size:54px">🎓</div><small style="letter-spacing:.2em;color:#C7D2FE">CSSP · SR UNIVERSITY</small><h1>Senior Mentor Tracker</h1><p style="color:#cbd5e1">Track. Verify. Mentor.</p><p style="margin-top:28px;line-height:2">✓ Submit your weekly LeetCode total<br>✓ Your senior verifies it live<br>✓ Secure, proctored tasks</p></div><div class="lf"><form onsubmit="event.preventDefault();login()"><div class="seg">${[['jr','🎓 Junior'],['sr','✔ Senior'],['ad','🏛 Super Admin']].map(x=>`<button type="button" class="${r===x[0]?'on':''}" onclick="S.role='${x[0]}';render()">${x[1]}</button>`).join('')}</div><label>Your name</label><select id="who"><option value="">Select your name</option>${opts.map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join('')}</select><label>4-digit PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"><br><button class="btn w">${{jr:'Open My Work',sr:'Open Senior',ad:'Open Overview'}[r]}</button><p class="note">Prototype: pick a name and enter any 4 digits. Real PINs come from the backend.</p></form></div></div>`}

function login(){if(!$('who').value)return toast('Select your name');if(!/^\d{4}$/.test($('pin').value))return toast('Enter 4 digits');if(S.role!=='jr'){S.o={n:$('who').value,r:S.role};return render()}S.u=JUN.find(j=>j.roll===$('who').value);S.tab='dash';S.n=null;S.p='';S.open=null;S.dr={};if(FB&&FB.apiKey){fbLogin(S.u.roll,$('pin').value).then(ok=>{if(!ok)S.u=null;render()})}else render()}
function setLink(k){const v=$('lk-'+k).value.trim();if(!/^https?:\/\//.test(v))return toast('Link must start with https://');(D.links[S.u.roll]=D.links[S.u.roll]||{})[k]=v;save();render()}

return `${heroV(j)}
<div class="card"><h2>This week's status</h2>${s?pill('⏳ Awaiting review','wa')+' Submitted '+s.n+' problems':pill('Not submitted yet','er')}</div>

function asmFile(id,el){const f=el.files[0];if(!f)return;if(!/\.(pdf|docx?|txt)$/i.test(f.name)){el.value='';return toast('Only PDF, Word (.doc/.docx) or TXT files')}if(f.size>7e5){el.value='';return toast('File too large (max 700 KB)')}const r=new FileReader();r.onload=e=>{S.dr[id+'_f']={name:f.name,size:f.size,data:e.target.result};render()};r.readAsDataURL(f)}
function asmSub(id){const a=AS.find(x=>x.id===id),d=k=>S.dr[id+'_'+k];let ans=[];
 if(a.ty==='mcq'){ans=a.qs.map((q,i)=>d(i));if(ans.some(x=>x==null))return toast('Answer every question')}
 else if(a.ty==='text'){ans=a.qs.map((q,i)=>d(i)||'');if(ans.some(x=>!x.trim()))return toast('Answer all questions first')}
 else if(a.ty==='link'){const v=(d('l')||'').trim();if(!/^https?:\/\/\S+$/.test(v))return toast('Paste a valid link (https://...)');ans=[v]}
 else if(a.ty==='file'){if(!d('f'))return toast('Choose a file first');ans=[d('f')]}
 D.asm[id+'|'+S.u.roll]={ty:a.ty,ans,sc:a.ty==='mcq'?ans.filter((x,i)=>x===a.qs[i].k).length:null,at:new Date().toLocaleString()};S.open=null;save();toast('✓ Submitted');render()}
const asmForm=a=>{const d=k=>S.dr[a.id+'_'+k];return (a.ty==='mcq'?a.qs.map((q,i)=>`<div style="margin-top:10px"><b>Q${i+1}.</b> ${esc(q.q)}${q.o.map((o,k)=>`<label style="display:block;border:1px solid var(--bd);border-radius:10px;padding:10px;margin:6px 0;cursor:pointer;color:var(--tx)"><input type="radio" style="width:auto" name="${a.id}${i}" ${d(i)===k?'checked':''} onchange="S.dr['${a.id}_${i}']=${k}"> ${esc(o)}</label>`).join('')}</div>`).join(''):a.ty==='text'?a.qs.map((q,i)=>`<div style="margin-top:10px"><b>Q${i+1}.</b> ${esc(q)}<textarea rows="4" oninput="S.dr['${a.id}_${i}']=this.value">${esc(d(i)||'')}</textarea></div>`).join(''):a.ty==='link'?`<label>Your solution / submission link</label><input placeholder="https://leetcode.com/submissions/..." value="${esc(d('l')||'')}" oninput="S.dr['${a.id}_l']=this.value">`:`<label>Upload PDF, Word or TXT (max 700 KB)</label><input type="file" accept=".pdf,.doc,.docx,.txt" onchange="asmFile('${a.id}',this)">${d('f')?`<div>${pill('📎 '+esc(d('f').name),'ok')}</div>`:''}`)+`<button class="btn w" onclick="asmSub('${a.id}')">Submit</button>`};
const asmRes=(a,t)=>t.ty==='mcq'?`<div>${pill('Score '+t.sc+'/'+a.qs.length,'ok')}</div>`:t.ty==='link'?`<div>${pill('Link submitted','ok')} <a href="${esc(t.ans[0])}" target="_blank" rel="noopener">${esc(t.ans[0])}</a></div>`:t.ty==='file'?`<div>${pill('📎 '+esc(t.ans[0].name),'ok')} <a href="${t.ans[0].data}" download="${esc(t.ans[0].name)}">Download</a></div>`:t.ty==='text'?`<details><summary>Your answers · ${t.at}</summary>${t.ans.map((x,i)=>`<div><b>Q${i+1}:</b> ${esc(x)}</div>`).join('')}</details>`:`<div class="m">Marked done · ${t.at}</div>`;
function asmV(){const j=S.u;return `<h1>📝 Assessments</h1><div class="card"><b>Open mode · no proctoring</b><p class="m" style="margin:4px 0 0">Assigned by Super Admin. Submit as a link, text, MCQ answers or a PDF / Word / TXT file. You can switch tabs, use notes and open links freely. No camera needed.</p></div>${AS.map(a=>{const t=D.asm[a.id+'|'+j.roll],op=S.open===a.id;return `<div class="card"><div class="row"><b class="g">${esc(a.title)}</b>${t?pill('✓ Submitted','ok'):pill('Pending','wa')}</div><div>${pill(TY[a.ty],'tl')}<span class="m">Due ${fd(a.due)}${a.max?' · Max '+a.max:''}</span></div><p>${esc(a.desc)}</p>${a.prob?`<a class="btn o" href="${esc(a.prob)}" target="_blank" rel="noopener">Open problem ↗</a>`:''}${!t&&a.ty!=='done'?`<button class="btn o" onclick="S.open=${op?'null':"'"+a.id+"'"};render()">${op?'Hide':'Answer / Submit'}</button>`:''}${!t&&a.ty==='done'?`<button class="btn" onclick="asmSub('${a.id}')">Mark as done</button>`:''}${op&&!t?asmForm(a):''}${t?asmRes(a,t):''}</div>`}).join('')}`}
const Q=q=>typeof q==='string'?{t:'text',q}:q,TYS={mcq:'☑ MCQ',blank:'▭ Fill in the blanks',text:'✍ Written'},FT=id=>A.find(x=>x.id===id)||INT.find(x=>x.id===id),myI=j=>INT.filter(a=>a.sr===j.sr),fdt=ms=>new Date(ms).toLocaleString([],{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const tom=(()=>{const d=new Date();d.setDate(d.getDate()+1);d.setHours(16,0,0,0);return+d})();
const INT=G.flatMap(([m],i)=>[{id:'demo-i1-'+i,iv:1,qs:[],sr:m,title:'DEMO · Live Interview (room open now)',get start(){return Date.now()-12e4},mins:30,topics:'DSA basics, your projects, problem solving'},{id:'demo-i2-'+i,iv:1,qs:[],sr:m,title:'Mock Live Interview (scheduled)',start:tom,mins:20,topics:'Arrays, strings, recursion, project discussion'}]);
function autoG(a,e){let g=0,n=0;a.qs.forEach((q0,i)=>{const q=Q(q0);if(q.t==='mcq'&&q.k!=null){n++;if(e.ans[i]===String(q.k))g++}else if(q.t==='blank'&&q.a){n++;if(q.a.some(z=>z.toLowerCase()===(e.ans[i]||'').trim().toLowerCase()))g++}});return n?[g,n]:null}
const ivRoom=a=>`<div class="card" style="text-align:center"><div style="font-size:48px">🎥</div><h2>Live interview with ${esc(a.sr)}</h2><p class="m">Topics: ${esc(a.topics)}</p><p>Camera and microphone are monitored. Stay in this window with your face visible, no other voices, no pasting or outside help. 1st violation = warning, 2nd = interview ends.</p><p class="note" style="color:var(--wa)">Two-way live video between you and your senior needs the backend (signaling). This build runs the proctored junior side.</p><button class="btn w" onclick="ask('Leave the interview? You cannot rejoin.','Leave',()=>endExam('done'))">Leave interview</button></div>`;
function intV(a,j){const t=D.att[a.id+'|'+j.roll],n=Date.now(),open=n>=a.start-3e5&&n<a.start+a.mins*6e4;return `<div class="card"><div class="row"><b class="g">${esc(a.title)}</b>${t?(t.st==='done'?pill('✓ Completed','ok'):pill('🚫 Ended after violation','er')):open?pill('● Join now','ok'):n<a.start?pill('Upcoming','tl'):pill('Missed','er')}</div><div class="m">Scheduled by ${esc(a.sr)} (Senior) · ${fdt(a.start)} · ${a.mins} min</div><p>Topics: ${esc(a.topics)}</p>${t?'':open?`<button class="btn w" onclick="startExam('${a.id}')">🎥 Join Live Interview</button>`:n<a.start?'<div class="m">Joining opens 5 minutes before the start time.</div>':''}</div>`}
function tasksV(){const j=S.u;return `<h1>🔒 Tasks</h1><div class="card"><b>Proctored · taken on this site only</b><p class="m" style="margin:4px 0 0">Camera + mic on, full-screen, no tab switching, no paste or AI tools. 1st violation = warning, 2nd = auto logout, no reattempt. Tasks can't be done through outside links or files. Answers are checked for copying and AI-written text.</p></div><h2>Tasks from your senior</h2>${myT(j).map(a=>{const t=D.att[a.id+'|'+j.roll],ty=[...new Set(a.qs.map(q=>Q(q).t))];return `<div class="card"><b>${esc(a.title)}</b><div>${ty.map(x=>pill(TYS[x],'tl')).join('')}<span class="m">Assigned by ${esc(a.sr)} (Senior) · Due ${fd(a.due)} · Max ${a.max}</span></div><p>${esc(a.desc)}</p>${t&&t.auto?`<div>${pill('Auto-graded '+t.auto[0]+'/'+t.auto[1],'ok')}<span class="m"> Written answers: pending senior review</span></div>`:''}${exJ(a,j)}</div>`}).join('')}<h2 style="margin-top:20px">🎥 Live interviews</h2>${myI(j).map(a=>intV(a,j)).join('')}`}
function camLbl(iv){const l=document.createElement('div');l.id='camlbl';l.textContent='● LIVE · PROCTORED';document.body.appendChild(l)}
async function enableCam(){const e=S.ex;if(!e||e.stream)return;try{const st=await navigator.mediaDevices.getUserMedia({video:true,audio:true});e.stream=st;const v=document.createElement('video');v.id='cam';v.autoplay=true;v.muted=true;v.playsInline=true;v.srcObject=st;document.body.appendChild(v);camLbl();initAudio(e);pstat();toast('✓ Camera and microphone are on')}catch(x){toast('Could not turn on the camera. Allow it in the browser, or open the saved file in Chrome.')}}
/* ===== Firebase sync (optional): set window.FIREBASE_CONFIG in firebase-config.js ===== */
const FB=window.FIREBASE_CONFIG;let fdb=null,fau=null;
async function fbInit(){if(!FB||!FB.apiKey||fdb)return;const u=m=>`https://www.gstatic.com/firebasejs/10.12.2/firebase-${m}.js`,[A,Au,Fs]=await Promise.all([import(u('app')),import(u('auth')),import(u('firestore'))]),app=A.initializeApp(FB);fau={m:Au,a:Au.getAuth(app)};fdb={m:Fs,d:Fs.getFirestore(app)}}
async function fbLogin(roll,pin){try{await fbInit()}catch(e){toast('Could not reach Firebase');return false}if(!fdb)return true;const em=roll.toLowerCase()+'@cssp.sru',pw=pin+'-cssp',m=fau.m;
 try{await m.signInWithEmailAndPassword(fau.a,em,pw)}catch(e){if(['auth/user-not-found','auth/invalid-credential'].includes(e.code)){try{await m.createUserWithEmailAndPassword(fau.a,em,pw)}catch(x){toast('Wrong PIN for this student');return false}}else{toast('Login failed: '+e.code);return false}}
 try{const F=fdb.m,r=await F.getDoc(F.doc(fdb.d,'users',roll));if(r.exists()){const x=r.data().data||{};D.links[roll]=x.links||D.links[roll]||{};['sub','asm','att'].forEach(k=>Object.assign(D[k],x[k]||{}));try{localStorage.setItem('jr-v1',JSON.stringify(D))}catch(e){}}}catch(e){toast('Could not load saved data')}return true}
function fbSlice(roll){const o={links:D.links[roll]||{}};['sub','asm','att'].forEach(k=>{o[k]={};Object.entries(D[k]).forEach(([a,v])=>{if(a.split('|').includes(roll))o[k][a]=v})});const c=JSON.parse(JSON.stringify(o));Object.values(c.asm).forEach(v=>{if(v.ty==='file'&&v.ans[0])v.ans[0]={name:v.ans[0].name,size:v.ans[0].size}});return c}
function fbPush(){if(!fdb||!S.u)return;const F=fdb.m;F.setDoc(F.doc(fdb.d,'users',S.u.roll),{data:fbSlice(S.u.roll),at:Date.now()}).catch(()=>{})}

render();
